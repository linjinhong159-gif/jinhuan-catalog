name: Build Puck Admin (manual backup)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare source
        run: |
          cp admin/puck-app.js puck-build/src/main.js
          cp admin/puck-admin.css puck-build/src/style.css
          cat admin/puck-extra.css >> puck-build/src/style.css

      - name: Install dependencies
        working-directory: puck-build
        run: npm install

      - name: Build
        working-directory: puck-build
        run: npm run build

      - name: Publish Puck backup bundle
        run: |
          rm -rf puck-admin-backup
          mkdir -p puck-admin-backup
          cp puck-build/dist/index.html puck-admin-backup/index.html
          cp -R puck-build/dist/assets puck-admin-backup/assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puck-admin-backup
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build Puck backup editor'
            git push
          fi

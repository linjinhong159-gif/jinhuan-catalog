name: Build Decap Catalogue

on:
  push:
    branches: [main]
    paths:
      - 'content/products/**'
      - 'content/categories/**'
      - 'content/pages/**'
      - 'content/store-settings/**'
      - 'scripts/build-catalog.mjs'
      - '.github/workflows/build-decap-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build catalogue manifest
        run: node scripts/build-catalog.mjs
      - name: Commit catalogue manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/catalog.json
          if git diff --cached --quiet; then
            echo 'No catalogue changes.'
          else
            git commit -m 'Build Decap catalogue manifest'
            git push
          fi

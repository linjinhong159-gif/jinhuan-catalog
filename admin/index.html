<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>JINHUAN · Decap CMS</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f6f3ee;font-family:Arial,"Microsoft YaHei",sans-serif}
    .jh-decap-top{height:54px;background:#151412;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:16px;position:sticky;top:0;z-index:9999}
    .jh-decap-brand{display:flex;align-items:center;gap:10px}.jh-decap-mark{width:30px;height:30px;border-radius:8px;background:#fff;color:#111;display:grid;place-items:center;font-size:10px;font-weight:800}.jh-decap-brand strong{display:block;font-size:13px}.jh-decap-brand small{display:block;color:#aaa;font-size:10px;margin-top:2px}.jh-decap-actions{display:flex;align-items:center;gap:8px}.jh-decap-actions a{color:#fff;text-decoration:none;border:1px solid #4a4742;border-radius:7px;padding:7px 10px;font-size:11px}.jh-live{color:#a9e3b1;font-size:11px}.jh-note{background:#edf7ee;color:#23452a;border-bottom:1px solid #cfe4d2;padding:9px 18px;font-size:12px}.jh-note b{font-weight:800}#nc-root{min-height:calc(100vh - 91px)}
  </style>
  <script>
    // Decap is hosted on GitHub Pages, but authentication is provided by the
    // Netlify project below. Setting this before the Identity widget loads
    // makes the widget use the correct remote Identity service.
    localStorage.setItem('netlifySiteURL','https://earnest-kitsune-1f3282.netlify.app/');
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script defer src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script defer src="./preview.js"></script>
</head>
<body>
  <header class="jh-decap-top">
    <div class="jh-decap-brand"><div class="jh-decap-mark">JH</div><div><strong>JINHUAN · Decap CMS</strong><small>商品管理 · 多图 · 价格 · 分类 · 页面模块</small></div></div>
    <div class="jh-decap-actions"><span class="jh-live">GitHub 正式保存模式</span><a href="../" target="_blank" rel="noopener">查看前台</a><a href="../puck-admin.html" target="_blank" rel="noopener">原 Puck</a></div>
  </header>
  <div class="jh-note"><b>登录方式已升级：</b>现在使用 Netlify Identity + Git Gateway，不再使用刚才会卡在 Authorized 的旧 OAuth 弹窗。登录后发布会直接写入 GitHub 仓库。</div>
  <div id="nc-root"></div>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('login', function () {
        window.netlifyIdentity.close();
      });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>JINHUAN · Decap CMS</title>
  <script>
    (function(){
      var adminHost='earnest-kitsune-1f3282.netlify.app';
      if(location.hostname!==adminHost){
        var target='https://'+adminHost+'/admin/'+(location.search||'')+(location.hash||'');
        location.replace(target);
      }
    })();
  </script>
  <style>
    html,body{margin:0;min-height:100%;background:#f6f3ee;font-family:Arial,"Microsoft YaHei",sans-serif}
    /* Keep the custom brand bar in normal document flow so it never covers
       Decap's own editor action bar (Save / Publish). */
    .jh-decap-top{height:44px;background:#151412;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px;position:relative;z-index:1}
    .jh-decap-brand{display:flex;align-items:center;gap:9px}.jh-decap-mark{width:27px;height:27px;border-radius:7px;background:#fff;color:#111;display:grid;place-items:center;font-size:9px;font-weight:800}.jh-decap-brand strong{display:block;font-size:12px}.jh-decap-brand small{display:block;color:#aaa;font-size:9px;margin-top:1px}.jh-decap-actions{display:flex;align-items:center;gap:7px}.jh-decap-actions a{color:#fff;text-decoration:none;border:1px solid #4a4742;border-radius:6px;padding:6px 9px;font-size:10px}.jh-live{color:#a9e3b1;font-size:10px}#nc-root{min-height:calc(100vh - 44px)}
  </style>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script defer src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script defer src="./preview.js"></script>
</head>
<body>
  <header class="jh-decap-top">
    <div class="jh-decap-brand"><div class="jh-decap-mark">JH</div><div><strong>JINHUAN · Decap CMS</strong><small>商品管理 · 多图 · 价格 · 分类 · 页面模块</small></div></div>
    <div class="jh-decap-actions"><span class="jh-live">GitHub 正式保存模式</span><a href="https://jinhuan.me/" target="_blank" rel="noopener">查看前台</a></div>
  </header>
  <div id="nc-root"></div>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('login', function () { window.netlifyIdentity.close(); });
    }
  </script>
</body>
</html>
